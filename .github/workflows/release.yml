name: Release Battery Widget

on:
  push:
    branches: [main]
    paths: [src/BatteryWidget/manifest.json]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: battery-widget-release

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -er .version src/BatteryWidget/manifest.json)"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            exit 0
          fi
          release_notes=(--generate-notes)
          if [[ "$tag" == "v1.0.3" ]]; then
            release_notes=(--notes "First release!")
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" --title "Battery Widget ${version}" "${release_notes[@]}"
          changelog="$(gh release view "$tag" --json body --jq .body)"
          gh workflow run macro-deck-release.yml --ref "$tag" -f "changelog=$changelog"
